# Foundry project for imd-beacon. Layout follows docs/SPEC.md §10.2.
# Dependencies are vendored as ordinary files under lib/ (no submodules, offline builds; SPEC §10.1).
[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"   # EIP-2537 BLS12-381 precompiles
optimizer = true
optimizer_runs = 200
